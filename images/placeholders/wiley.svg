<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <!-- White background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Wiley brand color background bar (optional subtle accent) -->
  <rect width="100%" height="80" y="0" fill="#003D7C" opacity="0.05"/>
  <rect width="100%" height="80" y="340" fill="#003D7C" opacity="0.05"/>

  <g transform="translate(400, 210)">
    <!-- Wiley logo text -->
    <text x="0" y="-20" text-anchor="middle" fill="#003D7C" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">
      Wiley
    </text>

    <!-- Online Library text -->
    <text x="0" y="25" text-anchor="middle" fill="#003D7C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">
      Online Library
    </text>

    <!-- Decorative line -->
    <line x1="-100" y1="50" x2="100" y2="50" stroke="#003D7C" stroke-width="2" opacity="0.3"/>

    <!-- Subtitle -->
    <text x="0" y="85" text-anchor="middle" fill="#666666" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">
      Scientific Publication
    </text>
  </g>
</svg>
